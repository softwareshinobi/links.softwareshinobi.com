<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cute Links</title>
    <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/slate/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .link-container {
            margin-top: 20px;
            text-align: center;
        }
        .btn-custom {
            margin: 10px;
            min-width: 400px; /* Adjust as needed */
            font-size: 1.1rem; /* Slightly larger font */
        }
        h1 {
            margin-bottom: 30px;
            color: #f8f9fa; /* Light color for dark theme */
        }
        .icon {
            margin-right: 8px; /* Space between icon and text */
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container text-center">
        <h1>My Links</h1>
        <div class="link-container">
            <a target="website" href="https://softwareshinobi.com" class="btn btn-primary btn-lg btn-custom">
                <i class="fas fa-globe icon"></i>Official Website
            </a>
            <br />
            <a target="youtube" href="https://www.youtube.com/@softwareshinobi" class="btn btn-danger btn-lg btn-custom">
                <i class="fab fa-youtube icon"></i>YouTube Channel
            </a>
            <br />
            <a target="resume" href="https://docs.google.com/document/d/10QNw6pYVD8Rmk0RXVreKRYqOTEiNgmUhNcOvbc0FlIs/edit?usp=sharing" class="btn btn-info btn-lg btn-custom">
                <i class="fas fa-file-alt icon"></i>Resume
            </a>
            <br />
            <a target="github" href="https://github.com/softwareshinobi" class="btn btn-secondary btn-lg btn-custom">
                <i class="fab fa-github icon"></i>GitHub
            </a>
            <br />
            <a target="gitea" href="https://code.softwareshinobi.com" class="btn btn-success btn-lg btn-custom">
                <i class="fas fa-code-branch icon"></i>Gitea
            </a>
            <br />
            <a target="coaching" href="https://calendly.com/software_shinobi" class="btn btn-warning btn-lg btn-custom">
                <i class="fas fa-calendar-check icon"></i>1-1 Coaching
            </a>
            <br />
            <a target="linkedin" href="https://linkedin.com/in/softwareshinobi" class="btn btn-primary btn-lg btn-custom">
                 <i class="fab fa-linkedin icon"></i>LinkedIn
            </a>
            <br />
            <a target="facebook" href="https://www.facebook.com/softwareshinobi" class="btn btn-primary btn-lg btn-custom" style="background-color: #3b5998; border-color: #3b5998;">
                 <i class="fab fa-facebook icon"></i>Facebook
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
